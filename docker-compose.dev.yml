services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhimao_dev
      POSTGRES_USER: zhimao
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdevpassword}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhimao']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
