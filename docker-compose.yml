services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhimao
      POSTGRES_USER: zhimao
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_prod:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://zhimao:${DB_PASSWORD:-changeme}@db:5432/zhimao
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - db
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - '80:80'

volumes:
  postgres_prod:
